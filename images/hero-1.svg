<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hero1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F2EF"/>
      <stop offset="50%" style="stop-color:#D4E5DE"/>
      <stop offset="100%" style="stop-color:#C5D8CF"/>
    </linearGradient>
    <radialGradient id="hero1glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#hero1bg)"/>
  <rect width="400" height="500" fill="url(#hero1glow)"/>
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="60" fill="#E8A87C" opacity="0.15"/>
  <circle cx="60" cy="420" r="80" fill="#2D6A5E" opacity="0.08"/>
  <!-- Handmade ceramic cup -->
  <g transform="translate(200, 260)">
    <!-- Saucer -->
    <ellipse cx="0" cy="90" rx="110" ry="18" fill="#FAF7F2"/>
    <ellipse cx="0" cy="86" rx="110" ry="18" fill="#F0EBE3"/>
    <!-- Cup body -->
    <path d="M-55 -20 Q-60 60 -40 80 L40 80 Q60 60 55 -20 Z" fill="#E8D5BC"/>
    <path d="M-55 -20 Q-60 60 -40 80 L40 80 Q60 60 55 -20 Z" fill="url(#hero1glow)" opacity="0.3"/>
    <!-- Cup rim -->
    <ellipse cx="0" cy="-20" rx="55" ry="14" fill="#D4C4A8"/>
    <ellipse cx="0" cy="-22" rx="50" ry="11" fill="#8B7355"/>
    <!-- Handle -->
    <path d="M55 -5 Q85 -5 85 25 Q85 50 55 45" fill="none" stroke="#E8D5BC" stroke-width="14" stroke-linecap="round"/>
    <!-- Scale pattern on cup -->
    <g opacity="0.3" stroke="#2D6A5E" stroke-width="1.5" fill="none">
      <path d="M-35 10 Q-25 2 -15 10 Q-5 2 5 10 Q15 2 25 10 Q35 2 45 10"/>
      <path d="M-30 35 Q-20 27 -10 35 Q0 27 10 35 Q20 27 30 35 Q40 27 45 35"/>
      <path d="M-25 58 Q-15 50 -5 58 Q5 50 15 58 Q25 50 35 58"/>
    </g>
    <!-- Steam -->
    <g opacity="0.4" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-15 -40 Q-20 -55 -10 -65 Q0 -75 -5 -90">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M5 -40 Q0 -55 10 -65 Q20 -75 15 -90">
        <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M20 -35 Q25 -50 15 -60">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  <!-- Dried flower decoration -->
  <g transform="translate(80, 140) rotate(-15)">
    <line x1="0" y1="0" x2="0" y2="100" stroke="#C9A96E" stroke-width="2"/>
    <ellipse cx="-8" cy="20" rx="6" ry="12" fill="#E8A87C" opacity="0.7" transform="rotate(-30 -8 20)"/>
    <ellipse cx="8" cy="35" rx="6" ry="12" fill="#D48B5C" opacity="0.6" transform="rotate(30 8 35)"/>
    <ellipse cx="-5" cy="55" rx="5" ry="10" fill="#E8A87C" opacity="0.5" transform="rotate(-20 -5 55)"/>
    <circle cx="0" cy="-5" r="8" fill="#C9A96E" opacity="0.8"/>
  </g>
  <!-- Small craft elements -->
  <g transform="translate(310, 380)">
    <rect x="-20" y="-15" width="40" height="30" rx="4" fill="#FAF7F2" stroke="#E8E2D9" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#2D6A5E">✦</text>
  </g>
</svg>
