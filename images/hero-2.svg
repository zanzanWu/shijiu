<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hero2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EDE0"/>
      <stop offset="100%" style="stop-color:#E8D5BC"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#hero2bg)"/>
  <circle cx="250" cy="60" r="50" fill="#E8A87C" opacity="0.2"/>
  <circle cx="40" cy="350" r="60" fill="#2D6A5E" opacity="0.1"/>
  <!-- Woven basket with crafts -->
  <g transform="translate(150, 230)">
    <!-- Basket -->
    <path d="M-70 -10 Q-75 60 -55 80 L55 80 Q75 60 70 -10 Z" fill="#D4A574"/>
    <path d="M-70 -10 Q-75 60 -55 80 L55 80 Q75 60 70 -10 Z" fill="#C49464" opacity="0.3"/>
    <!-- Weave pattern -->
    <g stroke="#B8845A" stroke-width="2" opacity="0.5">
      <line x1="-65" y1="10" x2="65" y2="10"/>
      <line x1="-62" y1="30" x2="62" y2="30"/>
      <line x1="-58" y1="50" x2="58" y2="50"/>
      <line x1="-50" y1="70" x2="50" y2="70"/>
    </g>
    <g stroke="#B8845A" stroke-width="1.5" opacity="0.4">
      <line x1="-40" y1="-10" x2="-42" y2="80"/>
      <line x1="-15" y1="-10" x2="-16" y2="80"/>
      <line x1="10" y1="-10" x2="11" y2="80"/>
      <line x1="35" y1="-10" x2="37" y2="80"/>
    </g>
    <!-- Basket rim -->
    <ellipse cx="0" cy="-10" rx="70" ry="14" fill="#C49464"/>
    <ellipse cx="0" cy="-12" rx="64" ry="11" fill="#A67C52"/>
    <!-- Yarn balls -->
    <circle cx="-35" cy="-35" r="22" fill="#E8A87C"/>
    <circle cx="-35" cy="-35" r="22" fill="none" stroke="#D48B5C" stroke-width="1" opacity="0.5"/>
    <path d="M-50 -40 Q-35 -50 -20 -38 Q-30 -28 -45 -32" fill="none" stroke="#D48B5C" stroke-width="1" opacity="0.4"/>
    <circle cx="5" cy="-45" r="25" fill="#7AB5A6"/>
    <circle cx="5" cy="-45" r="25" fill="none" stroke="#5A9A8C" stroke-width="1" opacity="0.5"/>
    <path d="M-15 -50 Q5 -60 20 -48 Q10 -38 -8 -42" fill="none" stroke="#5A9A8C" stroke-width="1" opacity="0.4"/>
    <circle cx="40" cy="-30" r="18" fill="#C9A96E"/>
    <!-- Knitting needles -->
    <line x1="-20" y1="-60" x2="30" y2="-20" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
    <line x1="-10" y1="-65" x2="40" y2="-25" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Scissors -->
  <g transform="translate(70, 100) rotate(30)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#2D6A5E" stroke-width="3"/>
    <circle cx="0" cy="25" r="10" fill="none" stroke="#2D6A5E" stroke-width="3"/>
    <line x1="6" y1="6" x2="35" y2="50" stroke="#2D6A5E" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="19" x2="35" y2="-25" stroke="#2D6A5E" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
